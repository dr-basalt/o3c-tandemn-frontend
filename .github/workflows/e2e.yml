name: E2E API Tests

on:
  push:
    branches: [main, master]
  schedule:
    # Smoke test toutes les heures — détecte downscaler, crash, OOM
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (no browser download)
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npx playwright install

      - name: Run E2E tests
        env:
          CI: true
          E2E_BASE_URL: https://platform.ori3com.cloud
          E2E_API_KEY: ${{ secrets.E2E_API_KEY }}
          E2E_ZERO_BALANCE_API_KEY: ${{ secrets.E2E_ZERO_BALANCE_API_KEY }}
          E2E_CLERK_SESSION_COOKIE: ${{ secrets.E2E_CLERK_SESSION_COOKIE }}
        run: npm run test:e2e:ci

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: e2e-results.xml
